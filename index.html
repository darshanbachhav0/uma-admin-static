<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#e11d48" />
  <meta name="description" content="Consola de administración de la Universidad María Auxiliadora: eventos, inscripciones y usuarios." />
  <meta name="robots" content="noindex, nofollow" />
  <title>UMA Admin</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e11d48'/%3E%3Ctext x='16' y='21' font-family='system-ui,sans-serif' font-size='12' font-weight='700' fill='white' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/pages.css" />

  <!-- Firebase SDKs (compat v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>

  <!-- Generated at build time by render-build.sh from environment variables. -->
  <script src="config.js"></script>
</head>
<body>
  <noscript>
    <div style="padding:24px;font-family:system-ui,sans-serif">
      Esta consola necesita JavaScript para funcionar. Habilítalo en tu navegador e inténtalo de nuevo.
    </div>
  </noscript>

  <div id="app">
    <!-- Replaced by the application once the session has been resolved. -->
    <div class="boot" role="status" aria-live="polite">
      <span class="brand-mark">UMA</span>
      <span class="spinner" style="color: var(--text-tertiary)"></span>
      <p class="boot__text">Cargando la consola…</p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
