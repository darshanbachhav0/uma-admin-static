<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Apply the stored appearance preference before any stylesheet paints, so
    there is no flash of the light theme for administrators who chose dark.
    Kept in sync with js/core/theme.js — update both if this logic changes.
  -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('uma.theme');
        var resolved = theme === 'dark' || theme === 'light'
          ? theme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', resolved);
        if (localStorage.getItem('uma.density') === 'compact') {
          document.documentElement.setAttribute('data-density', 'compact');
        }
      } catch (e) { /* storage unavailable (private mode, etc.) — light theme stays the default */ }
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#e11d48" />
  <meta name="description" content="Consola de administración de eventos de la Universidad María Auxiliadora." />
  <meta name="robots" content="noindex, nofollow" />
  <title>UMA Admin</title>

  <link rel="icon" href="assets/uma-logo.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/pages.css" />

  <!-- Firebase SDKs (compat v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- Generated at build time by render-build.sh from environment variables. -->
  <script src="config.js"></script>
</head>
<body>
  <noscript>
    <div style="padding:24px;font-family:system-ui,sans-serif">
      Esta consola necesita JavaScript para funcionar. Habilítalo en tu navegador e inténtalo de nuevo.
    </div>
  </noscript>

  <div id="app">
    <!-- Replaced by the application once the session has been resolved. -->
    <div class="boot" role="status" aria-live="polite">
      <img class="boot__logo" src="assets/uma-logo.jpg" alt="Universidad María Auxiliadora" />
      <span class="spinner" style="color: var(--text-tertiary)"></span>
      <p class="boot__text">Cargando la consola…</p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
